
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-link {
            font-size: 13px;
            color: var(--muted);
             margin-top: 15px;
            text-align: center;
        }
        .login-link a {
            color: var(--navy);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background: #3451c7;
        }

    </style>
</head>
<body>

<div class="login-container">
    <h2>Sign in</h2>

    <div class="form-group">
        <label>User name</label>
        <input type="text" id="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <p id="message"></p>
    <button class="login-btn" onclick="login()">
        Đăng nhập
    </button>

    <div class="login-link">
        <label>Don't have an account? </label><a href="Signup.html">Create Account</a>
    </div>
</div>

<script>
    async function login() {

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const requestBody = {
            username: username,
            password: password
        };

        await fetch("https://homeeagle.site/csrf", {
        method: "GET",
        credentials: "include"
        });
        const csrfToken = getCookie("XSRF-TOKEN");
        try {
            const response = await fetch(
                "https://homeeagle.site/auth/log-in",
                {
                    method: "POST",
                     credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                        "X-XSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify(requestBody)
                }
            );

            const data = await response.json();
            if (response.ok) {
                alert(data.message);

                const role = data.result.role;

                switch (role) {
                    case "RENTER":
                     window.location.href = "./Customer/Home_page.html";
                    break;

                case "LANDLORD":
                     window.location.href = "./LandLord/Manager_Apartment.html";
                     break;

                case "ADMIN":
                     window.location.href = "admin.html";
                     break;

                default:
                    document.getElementById("message").innerText =
                    "Không xác định được quyền người dùng.";
                }
                document.getElementById("message")
                    .style.color = "red";
                document.getElementById("message").innerText = data.message;
            }else{
                alert(data.message);
            }

        } catch (error) {
            console.error("Message:", error.message);
            alert("Không thể kết nối đến server");
        }
    }

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            // Kiểm tra tên cookie có khớp không
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>

</body>
</html>
